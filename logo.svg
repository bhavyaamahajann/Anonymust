<svg width="180" height="48" viewBox="0 0 200 52" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 3 soft overlapping circles (dots) -->
  <g opacity="0.9">
    <!-- Top Left Circle (Light Green) -->
    <ellipse cx="26" cy="20" rx="19" ry="18" fill="#6bd297" />
    <!-- Bottom Left Circle (Medium Green) -->
    <ellipse cx="18" cy="31" rx="18" ry="17" fill="#46b77c" />
    <!-- Right Circle (Soft Greyish Light Violet) -->
    <ellipse cx="40" cy="29" rx="18" ry="17" fill="#e8e8ee" opacity="0.85" />
  </g>
  <!-- Overlap blend -->
  <ellipse cx="24" cy="25" rx="12" ry="11" fill="#2d875e" opacity="0.4" />

  <!-- AnonyMust Brand Text -->
  <text x="64" y="34" font-family="'Satoshi', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="24" fill="#138496" letter-spacing="-0.02em">AnonyMust</text>
</svg>
